<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dungeon">
<title>Dungeon Tasks</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="hero" id="hero"></header>

<form class="capture" id="capture" autocomplete="off">
  <input id="captureInput" type="text" placeholder="завтра в 10 йога, важно" enterkeyhint="send" aria-label="Новая задача">
  <button type="button" class="mic" id="mic" aria-label="Надиктовать">🎙</button>
</form>

<main>
  <section class="view" data-view="today" id="v-today"></section>
  <section class="view" data-view="map" id="v-map" hidden></section>
  <section class="view" data-view="inbox" id="v-inbox" hidden></section>
  <section class="view" data-view="raid" id="v-raid" hidden></section>
  <section class="view" data-view="hero" id="v-hero" hidden></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span>☀️</span>Сегодня</button>
  <button data-tab="map"><span>🗺</span>Карта</button>
  <button data-tab="inbox"><span>📥</span>Сундук<b id="inboxBadge" hidden></b></button>
  <button data-tab="raid"><span>⚔</span>Рейд</button>
  <button data-tab="hero"><span>🛡</span>Герой</button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
