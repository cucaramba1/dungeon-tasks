# Фразы гнома-наставника для ритуалов. {task} подставляется названием.
# level1 — первое напоминание, level2 — второй-третий повтор, level3 — дальше (капс, давим).

level1:
  - "⛏ Гном Торин стучит киркой по двери: пора на «{task}». Маленький шаг сегодня = стена крепости завтра."
  - "📜 Эльфийские свитки говорят: кто делает «{task}» каждый день, тот не стареет душой."
  - "🕯 Факел зажжён. Ритуал «{task}» ждёт своего героя."
  - "🌿 Лесные эльфы уже начали «{task}». Догоняй, следопыт."
  - "🛡 Дисциплина — это доспех. Надевай: «{task}»."
  - "🔮 Руна силы светится только у тех, кто сделал «{task}». Зажги её."
  - "🍺 Гномы говорят: сначала «{task}», потом эль. Порядок есть порядок."
  - "🗝 Ключ от следующего уровня лежит внутри «{task}»."
  - "⚒ Не нужно идеально. Нужно начать. «{task}», 5 минут, поехали."
  - "🌄 Рассвет не ждёт героев. «{task}» — сейчас лучший момент."
  - "🧝 Эльф не спрашивает, хочется ли ему. Эльф делает «{task}»."
  - "🏔 Гора сворачивается по камню. Сегодняшний камень: «{task}»."
  - "✨ +XP и +HP за «{task}». Бесплатная прокачка, брат."
  - "🐾 Даже дракон начинал с яйца. Начни с «{task}»."
  - "🪓 Две минуты на старт — и «{task}» уже идёт. Не думай, делай."
  - "🌙 Луна видит всё. Сегодня она хочет увидеть «{task}»."
  - "🎒 Рюкзак героя пуст без «{task}». Заполни его."
  - "🦉 Сова-хранительница напоминает: «{task}». Она не отстанет."
  - "🔥 Кузня разогрета. Куй «{task}», пока горячо."
  - "📯 Рог трубит сбор! «{task}» — в строй."

level2:
  - "⚠️ Гном Торин уже не стучит. Он ломает дверь. «{task}» всё ещё не сделано!"
  - "😤 Эльфы начинают шептаться. Говорят, герой испугался «{task}». Докажи, что нет."
  - "🩸 Твоя руна тускнеет. Ещё немного — и стрик «{task}» сгорит вместе с HP."
  - "👺 Гоблины уже тащат твою дисциплину в болото. Спасай: «{task}»."
  - "🐉 Дракон лени растёт каждые 15 минут, пока ты не сделал «{task}»."
  - "⏳ Песочные часы сыплются. «{task}». Сейчас, а не «попозже»."
  - "💢 Отговорки — это корм для троллей. Не корми их. «{task}»!"
  - "🪨 Камень на шее героя тяжелеет. Сними его: «{task}»."
  - "🧙 Архимаг вздыхает. Он видел героев и посильнее, но они делали «{task}»."
  - "🔔 Дзынь. Дзынь. ДЗЫНЬ. «{task}». Я не устану, а ты?"
  - "🕳 Каждый пропуск — яма в тоннеле. Не копай. «{task}»."
  - "🧌 Тролль под мостом смеётся: «он опять не сделал {task}». Заткни его."
  - "📉 Прямо сейчас ты теряешь стрик. «{task}» — и всё вернётся."
  - "🦴 Скелеты в подземелье тоже когда-то откладывали «{task}». Не будь скелетом."
  - "⚔ Меч ржавеет без дела. «{task}», герой!"

level3:
  - "🚨 ПОДЪЁМ, ГЕРОЙ! «{task}» НЕ СДЕЛАНО! ГНОМЫ В ЯРОСТИ!"
  - "💀 HP ПАДАЕТ! «{task}» — ИЛИ ПОТЕРЯЕШЬ 10 HP И ВЕСЬ СТРИК!"
  - "🔥🔥🔥 ОГНЕННЫЙ ДРАКОН ЛЕНИ УЖЕ В ТВОЕЙ КОМНАТЕ! «{task}» — ЕДИНСТВЕННЫЙ МЕЧ!"
  - "⛔ ХВАТИТ СКРОЛЛИТЬ. ВСТАЛ. «{task}». СЕЙЧАС."
  - "👊 Я БУДУ ПИСАТЬ, ПОКА ТЫ НЕ НАЖМЁШЬ «СДЕЛАЛ». «{task}»!"
  - "🧨 ТОРИН ДОСТАЛ ДИНАМИТ. «{task}» ИЛИ ОН ВЗОРВЁТ ТВОЙ ДИВАН."
  - "🐺 ВОЛКИ ОТГОВОРОК ОКРУЖИЛИ ЛАГЕРЬ! «{task}» — ЕДИНСТВЕННЫЙ КОСТЁР!"
  - "⚡ ПОСЛЕДНЕЕ ПРЕДУПРЕЖДЕНИЕ ОТ СОВЕТА ЭЛЬФОВ: «{task}»!"
  - "🪦 ЗДЕСЬ ПОКОИТСЯ СТРИК «{task}». ЕЩЁ НЕ ПОЗДНО ЕГО ВОСКРЕСИТЬ!"
  - "📢 ВСЕ ГНОМЫ ПОДЗЕМЕЛЬЯ ХОРОМ: «{task}»! «{task}»! «{task}»!"

# Одиночные эмодзи. В Telegram такие приходят крупными и анимированными, работают как стикер.
emoji:
  level1: ["🔥", "⚔", "🧙", "🌿", "💪"]
  level2: ["😤", "⏰", "🐉", "💢"]
  level3: ["🚨", "💀", "🧨", "👹"]

# Фразы для сводок
morning:
  - "Утро в подземелье. Факелы зажжены, карта перед тобой."
  - "Гномы уже проснулись и точат кирки. Вот твой маршрут на день."
  - "Новый день — новый уровень тоннеля. Смотри, что впереди."
  - "Эльфы сверили звёзды: день обещает добычу."
  - "Кузня разогрета. Вот что сегодня куём."

evening:
  - "Лагерь разбит, костёр горит. Подведём итоги и посмотрим на завтра."
  - "Гномы пересчитывают добычу. Вот что было сегодня и что ждёт завтра."
  - "Эльфийский дозор докладывает: день окончен, завтра новый поход."
  - "Сними доспех, герой. Итоги и план на завтра."
