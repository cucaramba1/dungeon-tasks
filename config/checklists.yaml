# Стартовые чек-листы. Собраны из заметок «Утренний ритуал и чек-лист привычек на 30 дней»
# и «Чек-лист привычек 9-1». Менять удобнее командой /checklist в боте (она перекрывает этот файл).

morning:
  - Первый час без телефона
  - Стакан воды
  - Зарядка 15 минут
  - Выбрал 3 главные задачи дня
  - Самая тяжёлая задача идёт первой

evening:
  - Сундук разобран
  - План на завтра проверен
  - Дневник 10 минут
  - Телефон убран за час до сна
  - Лечь до 00:00
