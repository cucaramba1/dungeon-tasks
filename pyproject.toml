[project]
name = "dungeon-tasks"
version = "0.1.0"
description = "Локальный RPG task manager: Telegram-бот + PWA"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "caldav>=3.3.1",
    "fastapi>=0.141.1",
    "icalendar>=7.3.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
    "telethon>=1.45.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
